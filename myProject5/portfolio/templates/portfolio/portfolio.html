<!DOCTYPE html>
<html>
<head>
    <title> My Portfolio </title>
    
</head>
<body>
   <h1> Welcome to My Portfolio </h1>
   {% if students %}
       <h2> Student List </h2>
       <table>
           <thead>
               <tr>
                   <th>Name</th>
                   <th>Age</th>
                   <th>City</th>
               </tr>
           </thead>
           <tbody>
           {% for student in students %}
           <tr>
               <td>{{ student.name }}</td>
               <td>{{ student.age }}</td>
               <td>{{ student.city }}</td>
           </tr>
           {% endfor %}
   {% else %}
       <p>No students found.</p>
   {% endif %}
   </ul>
</body>
</html>
